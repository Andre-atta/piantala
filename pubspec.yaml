name: piantala
description: Un posto tranquillo per le tue piante — e per chi le cura.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Firebase ──────────────────────────────────────────────────
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.1.4
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  firebase_storage: ^12.2.0
  google_sign_in: ^6.2.1

  # ── Local Database ────────────────────────────────────────────
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # ── Notifications ─────────────────────────────────────────────
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

  # ── Networking ────────────────────────────────────────────────
  dio: ^5.5.0+1

  # ── Security ─────────────────────────────────────────────────

  # ── Sensors & Location ───────────────────────────────────────
  permission_handler: ^11.3.1
  flutter_device_compass: ^2.2.0

  # ── Media ─────────────────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── UI ────────────────────────────────────────────────────────
  flutter_reorderable_grid_view: ^4.0.0
  flutter_svg: ^2.3.2
  lottie: ^3.1.2

  # ── Data / Utils ──────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  uuid: ^4.4.2
  collection: ^1.18.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  # ── Code Generation ───────────────────────────────────────────
  build_runner: ^2.4.11
  freezed: ^2.4.0
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  riverpod_generator: ^2.3.0

  # ── Testing ───────────────────────────────────────────────────
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.3

  # ── Lint ──────────────────────────────────────────────────────
  very_good_analysis: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F4EBD8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/data/
    - assets/illustrations/plants/
    - assets/illustrations/rooms/
    - assets/svg/nav/
    - assets/svg/home/
    - assets/svg/common/
    - assets/svg/auth/

  fonts:
    - family: Sue Ellen Francisco
      fonts:
        - asset: assets/fonts/SueEllenFrancisco-Regular.ttf
    - family: Barriecito
      fonts:
        - asset: assets/fonts/Barriecito-Regular.ttf
    - family: Delius
      fonts:
        - asset: assets/fonts/Delius-Regular.ttf